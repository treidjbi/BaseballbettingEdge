name: Live Layer Proof

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD slate date; defaults to today.json date"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-layer-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Validate live-layer secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing SUPABASE_URL secret"
            missing=1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY secret"
            missing=1
          fi
          exit "$missing"

      - name: Build live events to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/build_live_events_to_supabase.py "${{ inputs.date }}"
