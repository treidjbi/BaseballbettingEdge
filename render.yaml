services:
  - type: worker
    name: baseball-betting-edge-boltodds-shadow
    runtime: python
    repo: https://github.com/treidjbi/BaseballbettingEdge.git
    branch: codex/boltodds-starter-trial
    autoDeploy: false
    buildCommand: pip install -r requirements-live.txt
    startCommand: python scripts/boltodds_ws_worker.py
    envVars:
      - key: BOLTODDS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BOLTODDS_TARGET_BOOKS
        value: fanduel,betmgm,betrivers,caesars
      - key: BOLTODDS_MARKET_ALIASES
        value: pitcher_strikeouts,player_strikeouts,pitcher strikeouts,player strikeouts
      - key: BOLTODDS_BATCH_SIZE
        value: "100"
      - key: BOLTODDS_FLUSH_SECONDS
        value: "30"
      - key: BOLTODDS_RAW_SAMPLE_LIMIT
        value: "5"
      - key: BOLTODDS_WS_MAX_MESSAGES
        value: "0"
