name: Lock Ledger Monitor

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD slate date; defaults to today.json date"
        required: false
        type: string
      observed_at:
        description: "Optional UTC ISO timestamp; defaults to workflow runtime"
        required: false
        type: string
      strict:
        description: "Fail if due lock rows are missing from operational_pick_locks"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lock-ledger-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Validate Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing SUPABASE_URL secret"
            missing=1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY secret"
            missing=1
          fi
          exit "$missing"

      - name: Check lock ledger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          STRICT_ARG=""
          if [ "${{ inputs.strict }}" = "true" ]; then
            STRICT_ARG="--strict"
          fi
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          OBSERVED_AT_ARG=""
          if [ -n "${{ inputs.observed_at }}" ]; then
            OBSERVED_AT_ARG="--observed-at ${{ inputs.observed_at }}"
          fi
          python scripts/monitor_lock_ledger.py $DATE_ARG $OBSERVED_AT_ARG $STRICT_ARG
